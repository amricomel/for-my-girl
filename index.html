<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Adventure ??</title>
    <style>
        body {
            margin: 0;
            background: #ffe3e3;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }
        p {
            color: #6c757d;
            margin: 0 0 15px 0;
            font-size: 14px;
        }
        #gameCanvas {
            background: #ffffff;
            border: 4px solid #ffb6c1;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 100%;
        }
        /* Modal Popup Styling */
        #pujukModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            border: 3px solid #ff4d6d;
            width: 320px;
            z-index: 10;
        }
        #pujukModal h2 {
            color: #ff4d6d;
            margin-top: 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        #yesBtn {
            background: #4caf50;
            color: white;
        }
        #noBtn {
            background: #f44336;
            color: white;
            position: absolute;
        }
        .controls {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Our Little Adventure: Misi Cari Bunga ??</h1>
    <p>Gerakkan BF (Biru) menggunakan arrow key/butang skrin untuk bagi bunga pada GF (Pink)!</p>

    <canvas id="gameCanvas" width="600" height="300"></canvas>

    <!-- Butang Kawalan untuk Mobile/Skrin Sentuh -->
    <div class="controls" style="margin-top: 10px; display: flex; gap: 10px;">
        <button onclick="moveLeft()" style="background: #ffb6c1; padding: 10px 20px;">? Kiri</button>
        <button onclick="moveRight()" style="background: #ffb6c1; padding: 10px 20px;">Kanan ?</button>
    </div>

    <!-- Popup Mesej Pujuk -->
    <div id="pujukModal">
        <h2>Saya Minta Maaf... ??</h2>
        <p>Saya tahu saya ada buat salah dan lukakan hati awak. I promise to be better for us. Maafkan saya, okay?</p>
        <div class="btn-container">
            <button id="yesBtn" onclick="forgiven()">Mestilah Mal! ??</button>
            <button id="noBtn" onmouseover="lari()" onclick="lari()">Tak Nak ??</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Karakter & Objek
        let bf = { x: 50, y: 220, width: 30, height: 40, speed: 5, color: "#3a86ff" };
        let gf = { x: 520, y: 220, width: 30, height: 40, color: "#ff006e" };
        let bunga = { x: 280, y: 230, radius: 10, color: "#ffbe0b", collected: false };

        // Rupa bentuk dunia (Ground)
        const groundY = 260;

        // Kontrol Keyboard
        let keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function moveLeft() { if(bf.x > 0) bf.x -= 20; }
        function moveRight() { if(bf.x < canvas.width - bf.width) bf.x += 20; }

        // Logik Game Loop
        function update() {
            // Pergerakan PC (Keyboard)
            if (keys["ArrowRight"] || keys["d"]) {
                if (bf.x < canvas.width - bf.width) bf.x += bf.speed;
            }
            if (keys["ArrowLeft"] || keys["a"]) {
                if (bf.x > 0) bf.x -= bf.speed;
            }

            // Check pelanggaran dengan bunga
            if (!bunga.collected) {
                let distToBunga = Math.hypot((bf.x + bf.width/2) - bunga.x, (bf.y + bf.height/2) - bunga.y);
                if (distToBunga < 25) {
                    bunga.collected = true;
                }
            }

            // Check bila dah bawa bunga sampai ke GF
            if (bunga.collected) {
                let distToGf = Math.hypot((bf.x + bf.width/2) - (gf.x + gf.width/2), (bf.y + bf.height/2) - (gf.y + gf.height/2));
                if (distToGf < 30) {
                    // Berhenti game dan tunjuk modal popup pujuk
                    document.getElementById("pujukModal").style.display = "block";
                    return; // Stop loop
                }
            }

            render();
            requestAnimationFrame(update);
        }

        // Lukis elemen dalam skrin
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Lukis Ground (Lantai)
            ctx.fillStyle = "#8ac926";
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Lukis BF (Karakter Biru + ada topi comel)
            ctx.fillStyle = bf.color;
            ctx.fillRect(bf.x, bf.y, bf.width, bf.height);
            ctx.fillStyle = "#000"; // Mata
            ctx.fillRect(bf.x + 20, bf.y + 10, 4, 4);

            // Lukis GF (Karakter Pink + reben)
            ctx.fillStyle = gf.color;
            ctx.fillRect(gf.x, gf.y, gf.width, gf.height);
            ctx.fillStyle = "#000"; // Mata
            ctx.fillRect(gf.x + 6, gf.y + 10, 4, 4);
            ctx.fillStyle = "#ff4d6d"; // Reben rambut
            ctx.beginPath();
            ctx.arc(gf.x + 5, gf.y, 6, 0, Math.PI * 2);
            ctx.fill();

            // Lukis Bunga (Kalau belum kena ambil)
            if (!bunga.collected) {
                ctx.fillStyle = bunga.color;
                ctx.beginPath();
                ctx.arc(bunga.x, bunga.y, bunga.radius, 0, Math.PI * 2);
                ctx.fill();
                // Batang bunga
                ctx.strokeStyle = "green";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(bunga.x, bunga.y + 10);
                ctx.lineTo(bunga.x, bunga.y + 25);
                ctx.stroke();
            } else {
                // Jika bunga dah diambil, lukis bunga di tangan BF
                ctx.fillStyle = bunga.color;
                ctx.beginPath();
                ctx.arc(bf.x + bf.width, bf.y + 20, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Trik butang "Tak Nak" melarikan diri
        function lari() {
            const noBtn = document.getElementById("noBtn");
            // Tukar posisi random dalam container butang
            const randomX = Math.floor(Math.random() * 160) - 80; 
            const randomY = Math.floor(Math.random() * 40) - 20;
            noBtn.style.left = `calc(50% + ${randomX}px)`;
            noBtn.style.top = `calc(10% + ${randomY}px)`;
        }

        // Bila dia klik Yes
        function forgiven() {
            alert("Yeay! Terima kasih sebab maafkan saya! I love you so much! ?? Ucapkan hello pada boyfriend awak semula!");
            document.getElementById("pujukModal").innerHTML = "<h2>Terima Kasih Sayang! ??</h2><p>Hubungan kita dah kembali jernih. Jom kita dating!</p>";
        }

        // Start game
        update();
    </script>
</body>
</html>
